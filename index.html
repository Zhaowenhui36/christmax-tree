<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Christmas Tree</title>
<style>
*{margin:0;padding:0}
body{
  background:#000;
  overflow:hidden;
}
canvas{
  display:block;
}
.text{
  position:fixed;
  bottom:80px;
  left:50%;
  transform:translateX(-50%);
  color:#b8e8ff;
  font-size:34px;
  font-weight:bold;
  letter-spacing:8px;
  text-shadow: 0 0 10px #80d8ff;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="text">zzzzwh</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let w = canvas.width = window.innerWidth;
let h = canvas.height = window.innerHeight;
window.addEventListener('resize',()=>{
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
})

class Particle{
  constructor(){
    this.x = 0;
    this.y = 0;
    this.z = 0;
    this.vx = 0;
    this.vy = 0;
    this.vz = 0;
    this.alpha = 1;
  }
  update(){
    this.x += this.vx;
    this.y += this.vy;
    this.z += this.vz;
    this.alpha -= 0.0032;
  }
  draw(){
    const sx = this.x / this.z * 210 + w/2;
    const sy = this.y / this.z * 210 + h*0.84;
    ctx.save();
    ctx.globalAlpha = this.alpha;
    ctx.beginPath();
    ctx.arc(sx, sy, 1.7, 0, Math.PI*2);
    ctx.fillStyle="#b0e4ff";
    ctx.fill();
    ctx.restore();
  }
}
let treeParticles = [];
let snowList = [];

function createTreePoint(theta){
  const p = new Particle();
  const heightRatio = theta / 8.5;
  const r = (1 - heightRatio) * 130;
  p.x = r * Math.cos(theta);
  p.y = - heightRatio * 360;
  p.z = r * Math.sin(theta) + 180;
  p.vx = (Math.random()-0.5)*0.022;
  p.vy = Math.random()*0.018;
  p.vz = (Math.random()-0.5)*0.022;
  return p;
}
function createHeart(){
  const hp = new Particle();
  const t = Math.random() * Math.PI * 2;
  hp.x = 16 * Math.pow(Math.sin(t),3);
  hp.y = - (13 * Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)) - 370;
  hp.z = 180;
  hp.vx = (Math.random()-0.5)*0.015;
  hp.vy = Math.random()*0.012;
  hp.vz = (Math.random()-0.5)*0.015;
  return hp;
}
function createSnow(){
  const s = new Particle();
  s.x = (Math.random()-0.5)*w*1.3;
  s.y = -30;
  s.z = Math.random()*110 + 35;
  s.vy = Math.random()*0.38 + 0.14;
  s.vx = (Math.random()-0.5)*0.11;
  return s;
}

let theta = 0;
function animate(){
  ctx.fillStyle="rgba(0,0,0,0.055)";
  ctx.fillRect(0,0,w,h);
  theta += 0.024;
  if(theta < 8.5){
    treeParticles.push(createTreePoint(theta));
  }
  if(Math.random()>0.62){
    treeParticles.push(createHeart());
  }
  if(Math.random()>0.76){
    snowList.push(createSnow());
  }

  for(let i = treeParticles.length-1;i>=0;i--){
    treeParticles[i].update();
    treeParticles[i].draw();
    if(treeParticles[i].alpha <= 0) treeParticles.splice(i,1);
  }
  for(let i = snowList.length-1;i>=0;i--){
    snowList[i].update();
    snowList[i].draw();
    if(snowList[i].alpha <=0) snowList.splice(i,1);
  }
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
