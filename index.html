<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Christmas Tree</title>
<style>
*{margin:0;padding:0}
body{
  background:#000;
  overflow:hidden;
}
canvas{
  display:block;
}
.text{
  position:fixed;
  bottom:120px;
  left:50%;
  transform:translateX(-50%);
  color:#b8e8ff;
  font-size:34px;
  font-weight:bold;
  letter-spacing:8px;
  text-shadow: 0 0 10px #80d8ff;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="text">zzzzwh</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let w = canvas.width = window.innerWidth;
let h = canvas.height = window.innerHeight;
window.addEventListener('resize',()=>{
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
})

class Particle{
  constructor(){
    this.x = 0;
    this.y = 0;
    this.z = 0;
    this.vx = 0;
    this.vy = 0;
    this.vz = 0;
    this.alpha = 1;
  }
  update(){
    this.x += this.vx;
    this.y += this.vy;
    this.z += this.vz;
    this.alpha -= 0.0035;
  }
  draw(){
    const sx = this.x / this.z * 220 + w/2;
    const sy = this.y / this.z * 220 + h*0.32;
    ctx.save();
    ctx.globalAlpha = this.alpha;
    ctx.beginPath();
    ctx.arc(sx, sy, 1.6, 0, Math.PI*2);
    ctx.fillStyle="#b0e4ff";
    ctx.fill();
    ctx.restore();
  }
}
let list = [];
let snow = [];

function createTreeParticle(t){
  const p = new Particle();
  const k = 0.72;
  const r = k * (220 - t) * Math.sin(t*2.8);
  p.x = r * Math.cos(t);
  p.y = -t * 1.3;
  p.z = r * Math.sin(t);
  p.vx = (Math.random()-0.5)*0.025;
  p.vy = Math.random()*0.02;
  p.vz = (Math.random()-0.5)*0.025;
  return p;
}
function createSnow(){
  const s = new Particle();
  s.x = (Math.random()-0.5)*w*1.4;
  s.y = -20;
  s.z = Math.random()*120+40;
  s.vy = Math.random()*0.4 + 0.15;
  s.vx = (Math.random()-0.5)*0.12;
  return s;
}
let t = 0;
function loop(){
  ctx.fillStyle="rgba(0,0,0,0.06)";
  ctx.fillRect(0,0,w,h);
  t += 0.022;
  if(t < 220){
    list.push(createTreeParticle(t));
  }
  if(Math.random()>0.75){
    snow.push(createSnow());
  }
  for(let i = list.length-1;i>=0;i--){
    list[i].update();
    list[i].draw();
    if(list[i].alpha <= 0) list.splice(i,1);
  }
  for(let i = snow.length-1;i>=0;i--){
    snow[i].update();
    snow[i].draw();
    if(snow[i].alpha <=0) snow.splice(i,1);
  }
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
