<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Christmas Tree</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#000;
  overflow:hidden;
}
canvas{display:block}
.bottom-text{
  position:fixed;
  bottom:80px;
  left:50%;
  transform:translateX(-50%);
  color:#b0e4ff;
  font-size:34px;
  font-weight:bold;
  letter-spacing:8px;
  text-shadow:0 0 10px #80d8ff;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bottom-text">zzzzwh</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let w = canvas.width = window.innerWidth;
let h = canvas.height = window.innerHeight;
window.addEventListener('resize', ()=>{
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
})

// 圣诞树螺旋点阵
const treePoints = [];
// 雪花
const snow = [];

// 生成锥形螺旋（越往上半径越小）
function buildTree(){
  for(let theta = 0; theta < 7.2 * Math.PI; theta += 0.06){
    // 高度系数 0~1
    const t = theta / (7.2 * Math.PI);
    // 底部宽，顶部收窄
    const r = (1 - t) * 120;
    const x = r * Math.cos(theta);
    const y = t * -340;
    const z = r * Math.sin(theta);
    treePoints.push({x,y,z,ox:x,oy:y,oz:z})
  }
  // 树顶爱心
  for(let t=0;t<2*Math.PI;t+=0.08){
    const hx = 16 * Math.pow(Math.sin(t),3);
    const hy = -(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)) - 355;
    const hz = 0;
    treePoints.push({x:hx,y:hy,z:hz,ox:hx,oy:hy,oz:hz})
  }
}

function makeSnowflake(){
  return {
    x:Math.random()*w,
    y:-10,
    s:Math.random()*1.2+0.4,
    speedY:Math.random()*0.4+0.15,
    speedX:(Math.random()-0.5)*0.15
  }
}
for(let i=0;i<80;i++) snow.push(makeSnowflake())

buildTree();

function loop(){
  ctx.fillStyle = 'rgba(0,0,0,0.06)';
  ctx.fillRect(0,0,w,h);

  // 圣诞树粒子轻微抖动
  for(let p of treePoints){
    p.x = p.ox + (Math.random()-0.5)*0.7;
    p.y = p.oy + (Math.random()-0.5)*0.7;
    p.z = p.oz + (Math.random()-0.5)*0.7;
    // 简单透视
    const scale = 200/(p.z+220);
    const sx = w/2 + p.x * scale;
    const sy = h*0.78 + p.y * scale;
    ctx.beginPath();
    ctx.arc(sx, sy, 1.6, 0, Math.PI*2);
    ctx.fillStyle='#b0e4ff';
    ctx.fill();
  }

  // 雪花
  for(let i=snow.length-1;i>=0;i--){
    const s = snow[i];
    s.y += s.speedY;
    s.x += s.speedX;
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.s,0,Math.PI*2);
    ctx.fillStyle="#b0e4ff";
    ctx.fill();
    if(s.y>h){
      snow[i]=makeSnowflake();
    }
  }
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
